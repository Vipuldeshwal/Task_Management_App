spring.application.name=Task Manager
server.port=${PORT:8080}

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:task_manager;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# JWT Configuration - Minimum 256 bits (32 bytes) for HS256
jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecureJWTSecretKeyForDevelopment12345}
jwt.expiration=86400000
